# Weekly version updates, grouped so that a week brings a handful of pull
# requests rather than one per package (ADR-0031). Every one of them touches a
# manifest, pnpm-lock.yaml or a workflow, so every one is tier 2: the owner reads
# and merges it, and CI is its only automatic judge, since a Dependabot pull
# request runs without the repository's Actions secrets.
#
# Security updates are not configured here: they follow the repository's
# setting, outside these groups and this schedule.
version: 2

updates:
  # One manifest per workspace package; pnpm is read under "npm".
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    # A version is offered a week after its release, not three days: a
    # compromised release is usually found and pulled within days.
    cooldown:
      default-days: 7
    # Minor and patch updates of the week in one pull request per kind of
    # dependency; a major update stays alone, since it is the one that breaks.
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
