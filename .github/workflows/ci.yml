name: CI

# Every branch is checked through its pull request; main is checked again after
# merge, because a rebase can produce a combination no pull request ever saw.
# That second check is called by the three workflows that publish from main —
# deploy.yml, eas-update.yml and eas-build.yml — each publishing only if it
# passes: a push trigger here would run it once more, in parallel with them.
on:
  pull_request:
  workflow_call:

# A second push to the same branch makes the run in flight pointless. The
# workflow's name keeps the three callers apart: called, github.workflow is the
# caller's, and on one ref alone the three runs of one push would cancel each
# other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Depth 2 keeps the parents of the merge commit a pull request checks
      # out, which is what the risk tier is computed against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # No version here on purpose: the action reads packageManager from
      # package.json, so pnpm can only be upgraded in one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # What the owner reads before merge, computed from the paths the pull
      # request touches (ADR-0028). It informs: whatever the tier, the step
      # passes. A pull request alone: called from a workflow on main, there is
      # no change to classify.
      #
      # The classifier is the base branch's, run by plain node from a worktree
      # of the base, before anything of the pull request is installed: a pull
      # request cannot lower its own tier by changing the classifier, its table
      # or its scripts. Whatever the classifier says, a change to what computes
      # the tier is shown as tier 2. HEAD^1 is the base side of the merge commit
      # checked out, so the diff is the pull request as it would merge.
      - name: Risk tier
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_tree="$RUNNER_TEMP/tier-base"
          git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --quiet --detach "$base_tree" "$BASE_SHA"
          classifier="$base_tree/tools/repo-checks/src/tier-cli.ts"

          if [ ! -f "$classifier" ]; then
            report="### Risk tier 2: the base branch has no classifier yet"
          elif ! report="$(node "$classifier" HEAD^1)"; then
            echo "::warning title=Risk tier::The base branch's classifier failed; tier 2 is shown."
            report="### Risk tier 2: the base branch's classifier failed"
          fi
          tier="$(printf '%s\n' "$report" | sed -n '1s/^### Risk tier \([012]\):.*/\1/p')"
          if [ -z "$tier" ]; then
            echo "::warning title=Risk tier::The base branch's classifier answered no tier; tier 2 is shown."
            printf -v report '### Risk tier 2: the classifier answered no tier\n\n%s' "$report"
            tier=2
          fi

          touches_classifier="$(git diff --name-only --no-renames HEAD^1...HEAD -- \
            AGENTS.md package.json .github tools/repo-checks)"
          if [ -n "$touches_classifier" ] && [ "$tier" != 2 ]; then
            printf -v report '### Risk tier 2: the change touches what computes its tier\n\nOverruled, the classifier said:\n\n%s' "$report"
          fi

          printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
          printf '::notice title=Risk tier::%s\n' "$(printf '%s\n' "$report" | head -n 1 | sed 's/^### //')"

      # Fails outright when pnpm-lock.yaml disagrees with the manifests, rather
      # than quietly resolving something else than what runs locally.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Cheapest first: a second for the whole workspace, so a missing hook
      # dependency or an unformatted file does not wait for the compiler.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # pnpm -r test skips a package that has no test script without a word, so
      # a package created with tests but no script would leave CI green having
      # run none of them. This refuses that package instead.
      - name: Check tests are collected
        run: pnpm check:tests

      # A component added without stories leaves the gallery silently behind
      # the library. Those not yet storied are listed, and the list only empties.
      - name: Check components have stories
        run: pnpm check:stories

      # A workflow on main that does not wait on this one publishes a red commit
      # as readily as a green one, as on 2026-10-06 (ADR-0027).
      - name: Check publishing waits on CI
        run: pnpm check:workflows

      - name: Test
        run: pnpm test

      # Catches what typecheck cannot: a missing asset, a native-only import,
      # anything that breaks bundling rather than compilation.
      - name: Build web bundle
        run: pnpm build:web
