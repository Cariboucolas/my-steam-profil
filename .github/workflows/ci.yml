name: CI

# Every branch is checked through its pull request; main is checked again after
# merge, because a rebase can produce a combination no pull request ever saw.
# That second check is called by the three workflows that publish from main —
# deploy.yml, eas-update.yml and eas-build.yml — each publishing only if it
# passes: a push trigger here would run it once more, in parallel with them.
on:
  pull_request:
  workflow_call:

# A second push to the same branch makes the run in flight pointless. The
# workflow's name keeps the three callers apart: called, github.workflow is the
# caller's, and on one ref alone the three runs of one push would cancel each
# other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Depth 2 keeps the parents of the merge commit a pull request checks
      # out, which is what the risk tier is computed against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # No version here on purpose: the action reads packageManager from
      # package.json, so pnpm can only be upgraded in one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails outright when pnpm-lock.yaml disagrees with the manifests, rather
      # than quietly resolving something else than what runs locally.
      - name: Install
        run: pnpm install --frozen-lockfile

      # What the owner reads before merge, computed from the paths the pull
      # request touches against AGENTS.md (ADR-0028). It informs: whatever the
      # tier, the step passes. A pull request alone: called from a workflow on
      # main, there is no change to classify. HEAD^1 is the base side of the
      # merge commit, so the diff is the pull request as it would merge.
      - name: Risk tier
        if: github.event_name == 'pull_request'
        run: |
          report="$(pnpm --silent check:tier HEAD^1)"
          printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
          printf '::notice title=Risk tier::%s\n' "$(printf '%s\n' "$report" | head -n 1 | sed 's/^### //')"

      # Cheapest first: a second for the whole workspace, so a missing hook
      # dependency or an unformatted file does not wait for the compiler.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # pnpm -r test skips a package that has no test script without a word, so
      # a package created with tests but no script would leave CI green having
      # run none of them. This refuses that package instead.
      - name: Check tests are collected
        run: pnpm check:tests

      # A component added without stories leaves the gallery silently behind
      # the library. Those not yet storied are listed, and the list only empties.
      - name: Check components have stories
        run: pnpm check:stories

      # A workflow on main that does not wait on this one publishes a red commit
      # as readily as a green one, as on 2026-10-06 (ADR-0027).
      - name: Check publishing waits on CI
        run: pnpm check:workflows

      - name: Test
        run: pnpm test

      # Catches what typecheck cannot: a missing asset, a native-only import,
      # anything that breaks bundling rather than compilation.
      - name: Build web bundle
        run: pnpm build:web
