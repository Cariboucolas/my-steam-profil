name: Preview

# Every pull request, so a change can be looked at before it is the live site.
# Reviewing a UI change by reading a diff is reviewing the diff, not the change.
#
# This workflow only builds, and holds no secret (ADR-0035). It runs as the pull
# request has it, so its code — and that of every dependency the pull request
# installs — runs here: a Dependabot pull request gets no secret on this trigger
# anyway, and no other one should give that code a deploy token. The bundles
# leave as an artifact; preview-deploy.yml, started by workflow_run as main has
# it, deploys them and posts the links.
on: pull_request

# One preview per pull request, and the one in flight IS cancelled — unlike a
# deployment onto main, where half a rollout is worse than a late one. Here the
# superseded build is a preview of a commit nobody will look at again.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Checkout reads, and nothing writes: the comment is preview-deploy.yml's.
permissions:
  contents: read

jobs:
  web:
    name: web
    # Same-repository pull requests only. preview-deploy.yml deploys none from
    # a fork — GitHub lists no pull request on such a run — so building one
    # would spend a runner on bundles nobody gets to see.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same guard as the deployment: the address is baked into the bundle, and
      # an empty one silently falls back to http://localhost:3000 — a preview
      # that looks right and answers nobody is worse than a failed build.
      - name: Refuse to build a bundle that points at localhost
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          test -n "$API_URL" || {
            echo "::error::API_URL is not set. Run: gh variable set API_URL --body <worker url>"
            exit 1
          }

      # The preview points at the API already running in production, and no API
      # is deployed here. That is deliberate rather than a shortcut: a preview
      # of a change to the app needs the backend the app will actually meet, and
      # standing up a second Worker would mean a pull request could run
      # `wrangler secret put` — a preview has no business holding the Steam key.
      #
      # A pull request that changes the API therefore gets a preview of the app
      # against the OLD backend. Worth knowing before trusting one.
      - name: Build the web bundle
        run: pnpm build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          # Emptied on purpose, as in the deployment: Metro substitutes this
          # wherever the environment carries it, and a runner that inherited one
          # would bake a personal SteamID64 into a public bundle.
          EXPO_PUBLIC_STEAM_ID: ""
          # The head commit of the branch, not the merge commit the checkout
          # sits on: a preview states a revision someone can `git show`. No
          # live flag here — a preview is a real deployment that says `dev`,
          # because it is not the live site (ADR-0016).
          EXPO_PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      # The component gallery for the same commit (#75), deployed to its own
      # Pages project so the app's bundle never carries Storybook. A preview
      # states `dev` and its commit, as the app's preview does (ADR-0016).
      - name: Build the gallery
        run: pnpm --filter @steam/mobile build:storybook
        env:
          EXPO_PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      # A bare `require` left in the bundle builds green and draws nothing: the
      # browser has no `require`, and every story fails before it renders.
      - name: Refuse a gallery that would draw nothing
        working-directory: apps/mobile
        run: |
          if grep -qE '(^|[^A-Za-z0-9_.$])require\(' storybook-static/assets/*.js; then
            echo "::error::The gallery bundle still calls require(), which the browser does not have."
            exit 1
          fi

      # Data for preview-deploy.yml, which reads nothing else of this run: it
      # deploys these files and runs none of them. Hidden files stay out, as
      # upload-artifact leaves them by default.
      - name: Hand the bundles to the deployment
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: |
            apps/mobile/dist
            apps/mobile/storybook-static
          if-no-files-found: error
          retention-days: 3
