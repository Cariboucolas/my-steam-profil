name: EAS Update

on:
  push:
    branches: [main]

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    name: preview channel
    # A kill switch, not a waiting room: Expo is configured and this publishes
    # on every merge. Setting EAS_ENABLED to anything but "true" stops the
    # updates without editing or reverting this workflow — which is what one
    # wants when the Expo account, and not the code, is what went wrong.
    if: vars.EAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish to the preview channel
        working-directory: apps/mobile
        env:
          # Same substitution as the web build: the update carries the address
          # of the deployed API, not localhost.
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          # And the commit it was built from, which the update message prints
          # too — the app can now say it without the Expo dashboard. An update
          # published from main is the live JavaScript on the preview channel,
          # so it says so (ADR-0016).
          EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_LIVE: "true"
          # Where an update reports what it cannot handle (ADR-0017). #98 was
          # published on this channel and stayed silent for days; this is the
          # variable that ends that, and emptying it is how it is turned off.
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          # Through the environment, never interpolated into the command: a
          # commit message is attacker-controlled text, and ${{ }} inside a run
          # block is substituted before the shell ever sees it.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        # An update message is a one-line label, read in the Expo dashboard
        # beside a branch and a runtime version — not a place for the prose
        # bodies this repo writes. EAS caps it at 1024 characters and truncates
        # what is longer, which is how a commit essay became a sentence cut in
        # half. `%%$'\n'*` drops everything from the first newline on, leaving
        # the subject line; the short SHA in front is what lets an update be
        # matched to a revision, since two commits can share a subject.
        run: |
          eas update --channel preview \
            --message "${GITHUB_SHA:0:7} ${COMMIT_MESSAGE%%$'\n'*}" \
            --non-interactive

      # `eas update` bundles into dist and leaves it there, which is what this
      # reads. Same guard as the web deploy, and for the same reason: where no
      # map was produced the upload script skips the asset and still exits zero,
      # so the only thing standing between a green run and an unreadable stack
      # is this test.
      #
      # After the update rather than before, because dist is what eas update
      # produced. A failure here is an update already published whose stacks
      # cannot be read — loud, and re-runnable, which silence was not.
      - name: Upload the source maps that make a stack readable
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$(find dist -name '*.map' -print -quit)" || {
            echo "::error::The update produced no source maps. Every stack would be unreadable."
            exit 1
          }
          pnpm exec sentry-expo-upload-sourcemaps dist
