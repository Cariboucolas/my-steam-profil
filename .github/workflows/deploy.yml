name: Deploy

# Only what is already on main. CI has passed by then, since main is protected.
on:
  push:
    branches: [main]

# Never two deployments onto the same environment at once. Unlike CI, an in
# flight deployment is not cancelled: half a deployment is worse than a late one.
concurrency:
  group: deploy
  cancel-in-progress: false

# Checkout needs to read; nothing at this level needs to write. The release
# job raises its own permission, so the deploy jobs — which run third-party
# actions — never hold a token that can rewrite the repository.
permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          # Pushes the key as a Worker secret on every deploy, so the running
          # Worker and the repository secret can never drift apart. The value
          # arrives through env, never on a command line where a log could
          # catch it (ADR-0001).
          secrets: |
            STEAM_API_KEY
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

  web:
    name: web
    # The bundle is built against the API that was just deployed, so it must
    # not go out before it.
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The address is baked into the bundle, and an empty one silently falls
      # back to http://localhost:3000 — a site that looks right and answers
      # nobody. API_URL is set once, after the first Worker deploy succeeds.
      - name: Refuse to build a bundle that points at localhost
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          test -n "$API_URL" || {
            echo "::error::API_URL is not set. Run: gh variable set API_URL --body <worker url>"
            exit 1
          }

      # EXPO_PUBLIC_ variables are substituted into the bundle, not read at
      # runtime: this address is baked into the JavaScript that ships. The
      # steam id is emptied rather than omitted, so the deployed app asks.
      - name: Build the web bundle
        run: pnpm build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          # Emptied on purpose, not merely left out. Metro substitutes this
          # variable wherever the environment carries it, so a runner that
          # inherited one would bake a personal SteamID64 into a public bundle.
          EXPO_PUBLIC_STEAM_ID: ""

      - name: Deploy to Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: >-
            pages deploy apps/mobile/dist
            --project-name=steam-achievements-czo
            --branch=main

  release:
    name: release
    # Both must have succeeded. A release that names a deployment which failed
    # is worse than no release at all.
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The only job here that writes: it creates a tag and a release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # A shallow clone cannot describe what changed since the last tag.
          fetch-depth: 0

      - name: Tag what is now in production
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          set -euo pipefail

          # Dated, and disambiguated by the commit: several merges a day is the
          # normal case in trunk-based development.
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          PREVIOUS=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')

          {
            echo "| | |"
            echo "|---|---|"
            echo "| Web | $WEB_URL |"
            echo "| API | $API_URL/health |"
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "[Changes since $PREVIOUS](https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$TAG)"
            fi
          } > notes.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
